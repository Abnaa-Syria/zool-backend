services:
  mysql:
    image: mysql:8.4
    container_name: zoolgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zoolgo
      MYSQL_USER: zoolgo
      MYSQL_PASSWORD: zoolgo
    ports:
      - "3308:3306"
    volumes:
      - zoolgo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-test:
    image: mysql:8.4
    container_name: zoolgo-mysql-test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zoolgo_test
      MYSQL_USER: zoolgo
      MYSQL_PASSWORD: zoolgo
    ports:
      - "3307:3306"
    volumes:
      - zoolgo_mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: zoolgo-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zoolgo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zoolgo_mysql_data:
  zoolgo_mysql_test_data:
  zoolgo_redis_data:
