              properties:
                companyId: { type: string }
                displayName: { type: string }
                phone: { type: string, example: '+249912345678' }
                driverCode: { type: string, example: ZGD-7649 }
                licenseNumber: { type: string }
                licenseExpiry: { type: string, format: date }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Phone or driver code already registered }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/drivers/{id}:
