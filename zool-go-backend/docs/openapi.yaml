      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vehicleId: { type: string }
                driverId: { type: string, nullable: true }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: VEHICLE_BUSY, DRIVER_BUSY, ASSIGNMENT_MISMATCH or TRIP_SEATS_TAKEN }
  /carriers/{companyId}/affected-trips:
    get:
      tags: [Carriers (admin)]
      summary: D-SUS-01 review - future, not-cancelled trips of the carrier that still carry confirmed bookings (carriers.view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/trips/{id}/cancel:
    post:
      tags: [Network (admin)]
      summary: D-SUS-01 cancel a trip that has not departed - stops sales, releases holds and refunds every confirmed booking in full with no fee; idempotent (catalog.manage + bookings.cancel)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        '200': { description: 'Trip cancelled; data = { trip, refundedBookings, refundedAmountMinor, failed[] }', content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: TRIP_NOT_CANCELLABLE (already departed) }
  /admin/settings:
    get:
      tags: [Settings (admin)]
      summary: D-SET-02 runtime settings with value, default, bounds and last editor (settings.view)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
    patch:
      tags: [Settings (admin)]
      summary: Change one or more settings; validated against the catalog, audited before/after, effective on every instance within ~5 s (settings.manage)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { oneOf: [{ type: number }, { type: boolean }, { type: string }] }
                  example: { 'booking.seatHoldTtlSeconds': 600, 'cash.enabled': true }
      responses:
        '200': { description: Updated list, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
