components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    brokerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Broker employee access token (typ broker_access)
  schemas:
    BookingLines:
      type: object
      required: [tripId, seatIds, passengers]
      properties:
        tripId: { type: string }
        seatIds: { type: array, items: { type: string } }
        passengers:
          type: array
          items:
            type: object
            required: [fullName, phone]
            properties:
              fullName: { type: string }
              phone: { type: string }
              idNumber: { type: string }
    SuccessEnvelope:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        statusCode: { type: integer, example: 200 }
        message: { type: string }
        data: {}
        meta:
          type: object
          additionalProperties: true
          properties:
            requestId: { type: string }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    ErrorEnvelope:
      type: object
      required: [success, statusCode, code, message]
      properties:
        success: { type: boolean, enum: [false] }
        statusCode: { type: integer, example: 403 }
        code: { type: string, example: PERMISSION_DENIED }
        message: { type: string }
        details: {}
        requestId: { type: string }
  responses:
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource or route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MalformedJson:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
