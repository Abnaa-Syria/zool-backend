        '409': { description: INSUFFICIENT_BALANCE / HOLD_REQUIRED / SEAT_UNAVAILABLE / EXPOSURE_CEILING_EXCEEDED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
