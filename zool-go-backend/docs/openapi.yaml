openapi: 3.0.3
info:
  title: ZoolGo Backend API
  version: 0.3.2
  description: Stage 1 + Stage 2 + Stage 2.6 + Milestone A + Milestone B P1 admin workflows + self-service admin phone change OTP — standardized envelopes
servers:
  - url: http://localhost:4000/api/v1
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /ready:
    get:
      summary: Readiness (MySQL + Redis)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /auth/otp/request:
    post:
      summary: Request OTP for existing admin phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+249900000001' }
      responses:
        '200':
          description: Challenge created (devOtp only when OTP_DEV_EXPOSE and non-production)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/verify:
    post:
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                challengeId: { type: string }
      responses:
        '200':
          description: Access token returned; refresh cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      summary: Rotate refresh token cookie and issue access token
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Revoke current refresh session and clear cookie
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /auth/logout-all:
    post:
      summary: Revoke all sessions for current admin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out all
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /auth/me:
    get:
      summary: Current admin + effective roles/permissions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/phone/otp/request:
    post:
      summary: Request OTP to the new phone for a self-service identity change. Authenticated; no admins.update. Does not issue tokens.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, example: '+249900000099' }
      responses:
        '200':
          description: Challenge created (devOtp only when OTP_DEV_EXPOSE and non-production). OTP is sent to the requested number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/phone/otp/verify:
    post:
      summary: Verify OTP on the new phone and update the caller's primary PHONE identity. Does not issue tokens. Bound to the authenticated admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                challengeId: { type: string }
      responses:
        '200':
          description: Updated admin profile (same shape as GET /auth/me). No new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admins:
    get:
      summary: List admins
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create admin
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /admins/{adminId}:
    get:
      summary: Get admin
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: adminId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update displayName (admins.update). Phone cannot be changed here — even with admins.update; use POST /auth/phone/otp/*. Does not change roles, status, or credentials.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: adminId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admins/{adminId}/sessions/revoke-all:
    post:
      summary: Revoke all active refresh sessions for a target admin (sessions.revoke). Bumps authzVersion. Does not suspend the account.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: adminId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{ revokedCount }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /admins/{adminId}/status:
    patch:
      summary: Suspend or reactivate admin
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: adminId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /admins/{adminId}/roles:
    put:
      summary: Replace admin roles
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: adminId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /roles:
    get:
      summary: List roles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      summary: Create role
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /roles/{roleId}:
    get:
      summary: Get role
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update role
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      summary: Delete non-system role
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /roles/{roleId}/permissions:
    put:
      summary: Replace role permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /permissions:
    get:
      summary: Permission catalog
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /sessions:
    get:
      summary: List active refresh sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /sessions/{sessionId}:
    delete:
      summary: Revoke session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /audit-logs:
    get:
      summary: List audit logs (audit.view). Database filters; reads are not audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer, maximum: 100 } }
        - { name: actorAdminId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: requestId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  # ---------------- Stage 2: broker vertical ----------------
  /broker/auth/otp/request:
    post:
      tags: [Broker Auth]
      summary: Request OTP for a broker employee phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+249900000101' }
      responses:
        '200': { description: Challenge created (devOtp only in non-production with OTP_DEV_EXPOSE), content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /broker/auth/otp/verify:
    post:
      tags: [Broker Auth]
      summary: Verify OTP; returns broker access JWT (typ broker_access) and sets zoolgo_broker_refresh cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                challengeId: { type: string }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /broker/auth/refresh:
    post:
      tags: [Broker Auth]
      summary: Rotate broker refresh cookie and issue a new access token
      responses:
        '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /broker/auth/logout:
    post:
      tags: [Broker Auth]
      summary: Revoke broker refresh session
      responses:
        '200': { description: Logged out, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/auth/me:
    get:
      tags: [Broker Auth]
      summary: Current broker employee (role, office, permissions)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /brokers:
    post:
      tags: [Brokers (admin)]
      summary: Create broker office + wallet(0) + optional manager (brokers.manage)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: ZG-BRK-1 }
                name: { type: string }
                settlementPeriod: { type: string, enum: [WEEKLY, MONTHLY] }
                minTopUpMinorOverride: { type: integer }
                exposureCeilingOverride: { type: integer }
                lowBalanceThresholdMinorOverride: { type: integer }
                timeZone: { type: string, example: Africa/Khartoum }
                manager:
                  type: object
                  required: [displayName, phone]
                  properties:
                    displayName: { type: string }
                    phone: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Brokers (admin)]
      summary: List broker offices (brokers.view)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /brokers/{officeId}:
    get:
      tags: [Brokers (admin)]
      summary: Office detail with employees and carrier assignments (brokers.view)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: officeId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Brokers (admin)]
      summary: Update office policy overrides (brokers.manage)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: officeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlementPeriod: { type: string, enum: [WEEKLY, MONTHLY] }
                minTopUpMinorOverride: { type: integer, nullable: true }
                exposureCeilingOverride: { type: integer, nullable: true }
                lowBalanceThresholdMinorOverride: { type: integer, nullable: true }
                timeZone: { type: string, nullable: true }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /brokers/{officeId}/staff:
    post:
      tags: [Brokers (admin)]
      summary: Create a clerk for the office (brokers.manage). Reuses broker staff rules; cannot create Super Admin or MANAGER.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: officeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, phone]
              properties:
                displayName: { type: string }
                phone: { type: string }
                canBook: { type: boolean }
                canTopUp: { type: boolean }
                canViewReports: { type: boolean }
                canManageStaff: { type: boolean }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /brokers/{officeId}/staff/{employeeId}:
    patch:
      tags: [Brokers (admin)]
      summary: Update office staff flags, name, or status (brokers.manage)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: officeId, in: path, required: true, schema: { type: string } }
        - { name: employeeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                canBook: { type: boolean }
                canTopUp: { type: boolean }
                canViewReports: { type: boolean }
                canManageStaff: { type: boolean }
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brokers/{officeId}/carriers:
    put:
      tags: [Brokers (admin)]
      summary: Replace carrier assignments [{companyId, commissionPercent}] (brokers.manage)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: officeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [companyId, commissionPercent]
                properties:
                  companyId: { type: string }
                  commissionPercent: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /brokers/{officeId}/status:
    patch:
      tags: [Brokers (admin)]
      summary: Activate or suspend an office (brokers.manage)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: officeId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/staff:
    get:
      tags: [Broker Staff]
      summary: List office staff (broker.staff.manage)
      security: [{ brokerBearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
    post:
      tags: [Broker Staff]
      summary: Create a clerk with permission flags and phone identity (broker.staff.manage)
      security: [{ brokerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, phone]
              properties:
                displayName: { type: string }
                phone: { type: string }
                canBook: { type: boolean, default: true }
                canTopUp: { type: boolean, default: false }
                canViewReports: { type: boolean, default: false }
                canManageStaff: { type: boolean, default: false }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/staff/{employeeId}:
    patch:
      tags: [Broker Staff]
      summary: Update clerk flags / status (broker.staff.manage); bumps authz version
      security: [{ brokerBearerAuth: [] }]
      parameters: [{ name: employeeId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/wallet:
    get:
      tags: [Broker Wallet]
      summary: Office wallet balance
      security: [{ brokerBearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/wallet/ledger:
    get:
      tags: [Broker Wallet]
      summary: Paginated wallet ledger
      security: [{ brokerBearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/wallet/top-ups:
    post:
      tags: [Broker Wallet]
      summary: Create PENDING top-up intent (broker.wallet.topup); min = office override or MIN_TOP_UP_AMOUNT
      security: [{ brokerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, idempotencyKey]
              properties:
                amountMinor: { type: integer, example: 100000 }
                idempotencyKey: { type: string }
      responses:
        '201': { description: Intent created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /broker/wallet/top-ups/{intentId}/mock-confirm:
    post:
      tags: [Broker Wallet]
      summary: Confirm a top-up via the mock provider (PAYMENT_PROVIDER=mock and NODE_ENV != production only)
      security: [{ brokerBearerAuth: [] }]
      parameters: [{ name: intentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Confirmed; wallet credited once, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /broker/wallet/top-ups/{intentId}/evidence:
    post:
      tags: [Broker Wallet]
      summary: Attach receipt evidence on a failed/unverified intent (broker.wallet.topup); transitions to PENDING_REVIEW
      security: [{ brokerBearerAuth: [] }]
      parameters: [{ name: intentId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [paymentReference, receipt]
              properties:
                paymentReference: { type: string }
                note: { type: string }
                receipt: { type: string, format: binary }
      responses:
        '200': { description: Pending review, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /payments/webhooks/{provider}:
    post:
      tags: [Payments]
      summary: Provider webhook; HMAC of raw body; credits matching SDG intent once
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
