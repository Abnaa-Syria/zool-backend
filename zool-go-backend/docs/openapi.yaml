  /admin/routes:
    get:
      tags: [Network (admin)]
      summary: List carrier routes with stops (catalog.view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer, maximum: 100 } }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: stationId, in: query, schema: { type: string }, description: Routes that start, end or stop at this station }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
    post:
      tags: [Network (admin)]
      summary: Create route with ordered intermediate stops (catalog.manage)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId, originStationId, destinationStationId, durationMinutes]
              properties:
                companyId: { type: string }
                code: { type: string, example: KRT-PZU }
                originStationId: { type: string }
                destinationStationId: { type: string }
                durationMinutes: { type: integer, example: 720 }
                stops:
                  type: array
                  items:
                    type: object
                    required: [stationId, offsetMinutes]
                    properties:
                      stationId: { type: string }
                      offsetMinutes: { type: integer, description: Minutes after departure (strictly increasing) }
                      dwellMinutes: { type: integer }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
