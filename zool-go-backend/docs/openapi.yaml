      tags: [Broker Reports]
      summary: Wallet ledger totals by type (broker.reports.view or manager)
      security: [{ brokerBearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /broker/commissions:
    get:
      tags: [Broker Commissions]
      summary: Unsettled commission accruals + total (broker.reports.view or manager)
      security: [{ brokerBearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /admin/commissions:
    get:
      tags: [Commissions (admin)]
      summary: List commission accruals, filter by officeId/status (commissions.view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: officeId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [UNSETTLED, RESERVED, SETTLED, CLAWED_BACK] } }
      responses:
        '200': { description: OK (meta.summary has totals), content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /admin/commissions/settlements:
    get:
      tags: [Commissions (admin)]
      summary: List commission settlements (commissions.view)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
    post:
      tags: [Commissions (admin)]
      summary: Create DRAFT settlement and reserve UNSETTLED accruals in the period (commissions.payout). Does NOT debit the office wallet.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officeId, periodFrom, periodTo]
              properties:
                officeId: { type: string }
                periodFrom: { type: string, format: date-time }
                periodTo: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '409': { description: NOTHING_TO_SETTLE / SETTLEMENT_OVERLAP, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /admin/commissions/settlements/{id}:
    get:
      tags: [Commissions (admin)]
      summary: Settlement summary including accrualCount and currency SDG (commissions.view). Accruals are not embedded; use the paginated accruals route.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/commissions/settlements/{id}/accruals:
    get:
      tags: [Commissions (admin)]
      summary: Paginated accruals reserved/linked to a settlement (commissions.view)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Paginated accruals; sum of amountMinor equals settlement totalAmountMinor, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/commissions/settlements/{id}/finalize:
    post:
      tags: [Commissions (admin)]
      summary: Finalize a DRAFT settlement (idempotent). Accruals RESERVED → SETTLED. (commissions.payout)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payoutReference: { type: string }
                note: { type: string }
      responses:
        '200': { description: Finalized, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /admin/commissions/settlements/{id}/cancel:
    post:
      tags: [Commissions (admin)]
      summary: Cancel a DRAFT settlement and release reserved accruals (commissions.payout)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
